AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Instance Stack

Parameters:
  SubnetId:
    Type: String

  SecurityGroupId:
    Type: String

Resources:
  ProcessingEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-09bf9dfeeb1e9adbc
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      

Outputs:
  InstanceId:
    Value: !Ref ProcessingEC2

  PublicIP:
    Value: !GetAtt ProcessingEC2.PublicIp
