AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Instance Stack


Resources:
  ProcessingEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-09bf9dfeeb1e9adbc
      SubnetId: !ImportValue PublicSubnetId

      SecurityGroupIds:
        - !ImportValue ApplicationSGId
      

Outputs:
  InstanceId:
    Value: !Ref ProcessingEC2

  PublicIP:
    Value: !GetAtt ProcessingEC2.PublicIp
