AWSTemplateFormatVersion: '2010-09-09'


Resources:

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: TransactionCluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/transaction-app

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: transaction-task

      Cpu: 256

      Memory: 512

      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      TaskRoleArn: !ImportValue TaskRoleArn
      ExecutionRoleArn: !ImportValue TaskRoleArn

      ContainerDefinitions:

        - Name: transaction-container

          Image: 446476244341.dkr.ecr.us-east-1.amazonaws.com/transaction-processor:latest

          Essential: true

          LogConfiguration:
            LogDriver: awslogs

            Options:
              awslogs-group: /ecs/transaction-app
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs
