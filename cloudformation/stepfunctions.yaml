AWSTemplateFormatVersion: '2010-09-09'



Resources:
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !ImportValue StepFunctionsRoleArn
      DefinitionString: |
        {
          "StartAt": "CheckEC2",
          "States": {
            "CheckEC2": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:describeInstances",
              "Parameters": {
                "MaxResults": 5
              },
              "Next": "RunECSTask"
            },
            "RunECSTask": {
              "Type": "Task",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Parameters": {
                "LaunchType": "FARGATE",
                "Cluster": "TransactionCluster",
                "TaskDefinition": "transaction-task",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "AssignPublicIp": "ENABLED",
                    "Subnets": ["${SubnetId}"],
                    "SecurityGroups": ["${SecurityGroup}"]
                  }
                }
              },
              "End": true
            }
          }
        }
       - SubnetId: !ImportValue PublicSubnetId
         SecurityGroup: !ImportValue ApplicationSGId
